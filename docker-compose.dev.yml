services:
  backend-dev:
    build: .
    container_name: crm_backend_dev
    ports:
      - "5002:5000"
    env_file:
      - .env.dev
    restart: unless-stopped
    networks:
      - crm_dev_network
    volumes:
      - /root/jsCRM/opt/jsc-secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

networks:
  crm_dev_network:
    external: true
